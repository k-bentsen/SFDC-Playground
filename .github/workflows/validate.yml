name: PR Validate

on:
  pull_request:
    branches: [dev, staging, master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.load.outputs.config }}
      org: ${{ steps.load.outputs.org }}
      testLevel: ${{ steps.load.outputs.testLevel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: load
        run: node scripts/ci/resolve-config.mjs "${{ github.base_ref }}"

  delta:
    needs: resolve-config
    runs-on: ubuntu-latest
    outputs:
      hasChanges: ${{ steps.gen.outputs.hasChanges }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # actions/checkout narrows the origin fetch refspec to just the PR's
      # head branch, so a plain `git fetch origin <base>` only populates
      # FETCH_HEAD, not refs/remotes/origin/<base> - sgd then can't resolve
      # "origin/<base>" and silently diffs against nothing. Fetch into an
      # explicit ref instead. Repo is already unshallowed (fetch-depth: 0
      # above), so no --depth here.
      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      # Cheap check before any of the expensive CLI/plugin installs below:
      # if nothing under the configured source directory changed, there's
      # nothing for sgd to find either. sourceDir is configurable via
      # .github/ci-config.json for non-default SFDX layouts.
      - id: check
        name: Check for relevant changes
        run: |
          SOURCE_DIR="${{ fromJSON(needs.resolve-config.outputs.config).sourceDir }}"
          if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- "$SOURCE_DIR"; then
            echo "No changes under $SOURCE_DIR."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.relevant == 'true'
        with:
          node-version: 22
      - name: Install Salesforce CLI
        if: steps.check.outputs.relevant == 'true'
        run: npm install --global @salesforce/cli
      # --force alone does not suppress the "isn't signed by Salesforce, do
      # you trust it?" prompt on this plugin - pipe an answer directly in.
      - name: Install sfdx-git-delta
        if: steps.check.outputs.relevant == 'true'
        run: yes | sf plugins install sfdx-git-delta --force
      - id: gen
        name: Generate delta
        run: |
          if [ "${{ steps.check.outputs.relevant }}" != "true" ]; then
            echo "hasChanges=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p delta_output
          sf sgd:source:delta --to HEAD --from "origin/${{ github.base_ref }}" --output-dir delta_output --generate-delta
          # sgd always writes a well-formed package.xml (with just the XML
          # boilerplate) even when zero components changed, so checking
          # file existence/non-emptiness is never a reliable signal - check
          # for an actual <types> entry instead.
          if grep -q '<types>' delta_output/package/package.xml 2>/dev/null || grep -q '<types>' delta_output/destructiveChanges/destructiveChanges.xml 2>/dev/null; then
            echo "hasChanges=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasChanges=false" >> "$GITHUB_OUTPUT"
          fi
      # A leading-dot directory name (the original .delta) tripped up
      # upload-artifact's internal file discovery - it reported "No files
      # were found" even though the files verifiably existed on disk.
      # delta_output (no leading dot) avoids that.
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.relevant == 'true'
        with:
          name: delta
          path: delta_output

  static-analysis:
    needs: [resolve-config, delta]
    if: fromJSON(needs.resolve-config.outputs.config).checks.staticAnalysis.enabled && needs.delta.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    # contents:read for checkout/artifact download; pull-requests:write for
    # the PR review comment forcedotcom/run-code-analyzer posts. Job-scoped
    # permissions replace the workflow default entirely, so both must be
    # listed even though contents:read alone would otherwise be implicit.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delta
          path: delta_output
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Install Code Analyzer plugin
        run: sf plugins install code-analyzer@latest
      # forcedotcom/run-code-analyzer (Salesforce's own action) posts a PR
      # review comment summarizing violations, publishes a GitHub Actions
      # job summary with the full detail view, and uploads the HTML/JSON
      # report as a workflow artifact - no need to hand-parse results.
      - name: Run Salesforce Code Analyzer
        id: analyze
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace delta_output/force-app --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: static-analysis-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Posts a review comment on each violation's specific line, filtered
      # to fromJSON(...).checks.staticAnalysis.inlineComments.minSeverity
      # and above (critical/high/medium/low/info). Best-effort: a line
      # outside this PR's diff can't be commented on inline by GitHub, see
      # the script for the fallback behavior.
      - name: Post inline PR comments
        if: fromJSON(needs.resolve-config.outputs.config).checks.staticAnalysis.inlineComments.enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MIN_SEVERITY: ${{ fromJSON(needs.resolve-config.outputs.config).checks.staticAnalysis.inlineComments.minSeverity }}
          RESULTS_FILE: sfca_results.json
        run: node scripts/ci/post-inline-comments.mjs
      # Only Sev1 (critical) / Sev2 (high) violations in changed files
      # block the PR; lower severities stay visible in the report (PR
      # comment / job summary / artifact above) without blocking merge.
      - name: Fail on critical/high violations
        if: |
          steps.analyze.outputs.num-sev1-violations-in-changed-files > 0 ||
          steps.analyze.outputs.num-sev2-violations-in-changed-files > 0
        run: exit 1

  secret-scan:
    needs: resolve-config
    if: fromJSON(needs.resolve-config.outputs.config).checks.secretScan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action requires a license for private-repo use beyond its
      # free tier - if that's a blocker, swap this step for the OSS gitleaks
      # CLI directly: `gitleaks detect --source . --log-opts="origin/<base>..HEAD"`.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-validate:
    needs: [resolve-config, delta]
    if: fromJSON(needs.resolve-config.outputs.config).checks.apexValidation && needs.delta.outputs.hasChanges == 'true'
    runs-on: ubuntu-latest
    environment: ${{ fromJSON(needs.resolve-config.outputs.config).org }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delta
          path: delta_output
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Include Flow Tests for changed flows
        if: fromJSON(needs.resolve-config.outputs.config).checks.flowTests
        run: node scripts/ci/resolve-flow-tests.mjs
      - name: Resolve impacted Apex tests
        id: tests
        if: fromJSON(needs.resolve-config.outputs.config).testLevel == 'RunSpecifiedTests'
        run: node scripts/ci/resolve-tests.mjs
      - name: Authenticate to target org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > authfile
          sf org login sfdx-url --sfdx-url-file authfile --alias target-org --set-default
      - name: Validate deploy
        run: |
          LEVEL="${{ fromJSON(needs.resolve-config.outputs.config).testLevel }}"
          if [ "$LEVEL" = "RunSpecifiedTests" ]; then
            TESTS="${{ steps.tests.outputs.tests }}"
            if [ -z "$TESTS" ]; then
              # resolve-tests.mjs already fails its own step (non-zero exit)
              # when Apex changed with no covering test - reaching here with
              # an empty list means the delta has no Apex at all. NoTestRun
              # is not a valid --test-level value on current sf CLI (only
              # RunAllTestsInOrg/RunLocalTests/RunSpecifiedTests/
              # RunRelevantTests are); per Salesforce docs, --test-level can
              # simply be omitted when the deployment contains no Apex.
              echo "No Apex in the delta - omitting --test-level."
              sf project deploy validate --source-dir delta_output/force-app --wait 33
            else
              # $TESTS is intentionally unquoted: resolve-tests.mjs emits
              # space-separated names, and current sf CLI expects --tests
              # as space-separated names (a single quoted/comma-joined
              # string is treated as one nonexistent test name).
              sf project deploy validate --source-dir delta_output/force-app --test-level RunSpecifiedTests --tests $TESTS --wait 33
            fi
          else
            sf project deploy validate --source-dir delta_output/force-app --test-level "$LEVEL" --wait 33
          fi

  pr-gate:
    needs: [resolve-config, delta, static-analysis, secret-scan, deploy-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate enabled check results
        run: |
          for result in "${{ needs.resolve-config.result }}" "${{ needs.delta.result }}" "${{ needs.static-analysis.result }}" "${{ needs.secret-scan.result }}" "${{ needs.deploy-validate.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required check failed or was cancelled."
              exit 1
            fi
          done
          echo "All enabled checks passed (skipped checks are not blocking)."
